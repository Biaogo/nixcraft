name: patch drift

# pkgs/patches/*.py rewrite upstream Rust sources with string needles. When storytold
# fixes or moves the code a needle points at, the patch becomes a silent no-op and a Craft
# app quietly loses a fix. This compares every rule against the pinned revision in
# flake.lock and against upstream's default branch.
#
# A red run means: read the upstream diff for the files named in the summary, and if the
# fix landed upstream, delete that rule (or update its needle) in pkgs/patches/.
# The vendored-egui rules in pkgs/patches/vendor-egui.py are not checked here: they already
# fail the build loudly when the crate moves.

on:
  schedule:
    # Daily 12:00 Asia/Shanghai (= 04:00 UTC), before the 16:00 UTC build.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compare every patch against upstream
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python3 .github/ci/patch-drift.py --summary patch-drift.md
        continue-on-error: true

      - name: Report the drift
        if: steps.check.outcome == 'failure' && hashFiles('patch-drift.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "patch drift: a Craft patch no longer matches upstream"
          BODY: patch-drift.md
        run: |
          set -euo pipefail
          cat "$BODY"
          num=$(gh issue list --state open --search "in:title patch drift" --json number,title --jq '.[] | "\(.number)\t\(.title)"' | awk -F'\t' -v t="$TITLE" '$2 == t {print $1; exit}')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body-file "$BODY"
          else
            gh issue create --title "$TITLE" --label patch-drift --body-file "$BODY" || gh issue create --title "$TITLE" --body-file "$BODY"
          fi

      - name: Fail on drift
        if: steps.check.outcome == 'failure'
        run: exit 1
